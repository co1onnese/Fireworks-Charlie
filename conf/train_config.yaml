datasets:
  dev:
    format: jsonl
    path: storage/rlvr_datasets/dev.jsonl
  train:
    format: jsonl
    path: storage/rlvr_datasets/train.jsonl
logging:
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
model:
  mode: deepseek-chat
  name: accounts/fireworks/models/deepseek-v3p1-terminus
output:
  dir: outputs/training
  format: jsonl
reward_config:
  evaluator_id: stock-prediction-evaluator
  evaluator_name: Stock Prediction Verifiable Reward
training:
  algorithm: grpo
  batch_size: 32768
  epochs: 1
  learning_rate: 0.0001
  lora_rank: 8
  max_tokens: 2048
  n_responses: 4
  temperature: 0.7
